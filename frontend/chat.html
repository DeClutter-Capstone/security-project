<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IEA</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="title">Chats</div>
        <button class="icon-btn" onclick="toggleSearch()" title="Find someone">+</button>
      </div>

      <div class="search-panel" id="search-panel">
        <input class="search-input" id="search-input" placeholder="Search username"
               oninput="onSearch()" />
        <div class="search-result" id="search-result"></div>
      </div>

      <div class="user-list" id="user-list"></div>

      <div class="sidebar-bottom">
        <div class="profile-strip" id="profile-strip" onclick="toggleProfile(event)">
          <span id="me-avatar"></span>
          <span class="u-name" id="me-name"></span>
        </div>
        <button class="text-link" onclick="doLogout()">Log out</button>
      </div>

      <!-- Profile popup -->
      <div class="profile-popup" id="profile-popup">
        <div id="pp-avatar"></div>
        <div class="pp-name" id="pp-name"></div>
        <div class="divider"></div>
        <div class="pp-label">Change password</div>
        <input class="field" type="password" id="pp-new" placeholder="New password" />
        <input class="field" type="password" id="pp-confirm" placeholder="Confirm password" />
        <button class="btn-primary" style="margin-top:8px" onclick="updatePassword()">
          Update Password
        </button>
        <div class="pp-message" id="pp-message"></div>
      </div>
    </aside>

    <!-- Chat area -->
    <main class="chat">
      <div class="chat-header" id="chat-header" style="display:none"></div>
      <div class="messages" id="messages">
        <div class="empty-chat">
          <div class="empty-title">Your messages</div>
          <div class="empty-sub">Pick a chat from the list, or tap + to start a new one.</div>
        </div>
      </div>
      <div class="composer" id="composer" style="display:none">
        <div class="preview-strip" id="preview-strip"></div>
        <div class="composer-inner">
          <input type="file" id="image-input" accept="image/*" style="display:none"
                 onchange="onFilePicked()" />
          <button class="attach-btn" onclick="document.getElementById('image-input').click()"
                  title="Add a photo">+</button>
          <div class="composer-field" id="composer-field">Add a photo to send</div>
          <button class="send-btn" id="send-btn" onclick="sendImage()" disabled>Send</button>
        </div>
      </div>
      <div class="drop-overlay" id="drop-overlay">
        <div class="drop-overlay-inner">Drop image to send</div>
      </div>
    </main>
  </div>

  <!-- Image viewer (click an image to expand / download) -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
    <div class="lightbox-content">
      <img id="lightbox-img" src="" alt="photo" />
      <div class="lightbox-actions">
        <a class="download" id="lightbox-download" href="" download="image.jpg">Download</a>
        <button onclick="closeLightbox()">Close</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    requireAuth();
    if (isAdmin()) window.location.href = "admin.html";

    const me = getUsername();
    document.getElementById("me-name").textContent = me;

    // Profile strip avatar + popup contents.
    function setupProfile() {
      document.getElementById("me-avatar").innerHTML = avatarEl(me, "sm");
      document.getElementById("pp-name").textContent = me;
      document.getElementById("pp-avatar").innerHTML =
        `<div class="avatar" style="width:56px;height:56px;font-size:22px;` +
        `background:${avatarColor(me)}">${(me[0] || "?").toUpperCase()}</div>`;
    }

    function toggleProfile(e) {
      if (e) e.stopPropagation();
      document.getElementById("profile-popup").classList.toggle("open");
      document.getElementById("pp-message").textContent = "";
    }

    async function updatePassword() {
      const pw = document.getElementById("pp-new").value;
      const confirm = document.getElementById("pp-confirm").value;
      const msg = document.getElementById("pp-message");
      if (!pw || pw !== confirm) {
        msg.className = "pp-message err";
        msg.textContent = "Passwords do not match";
        return;
      }
      try {
        const res = await apiFetch("/update-profile", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ new_password: pw }),
        });
        if (!res.ok) {
          msg.className = "pp-message err";
          msg.textContent = "Could not update password";
          return;
        }
        document.getElementById("pp-new").value = "";
        document.getElementById("pp-confirm").value = "";
        msg.className = "pp-message ok";
        msg.textContent = "Password updated";
        setTimeout(() => {
          msg.textContent = "";
        }, 2000);
      } catch (err) {
        msg.className = "pp-message err";
        msg.textContent = "Could not update password";
      }
    }

    const AVATAR_COLORS = ["#f4845f", "#a8c5da", "#b8a9c9", "#92c7a3", "#f0c27f", "#7eb8c9"];
    const IMG_ICON =
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>';

    let activePeer = null;
    let ws = null;

    // Sidebar is built ONLY from conversation history + manually added users.
    let conversationUsers = []; // [{username, online}] from GET /conversations
    let addedUsers = loadAddedUsers(); // {username: {online}} persisted per user
    let searchDirectory = []; // results of GET /users, used by + search only

    // In-memory image caches so images appear without re-fetching/flicker.
    const sentImageCache = {}; // message_id -> original data URL (this session)
    const receivedImageCache = {}; // message_id -> base64 jpeg of decrypted image
    const decrypting = new Set(); // message_ids currently being auto-opened

    function loadAddedUsers() {
      try {
        return JSON.parse(sessionStorage.getItem("added_" + me)) || {};
      } catch (e) {
        return {};
      }
    }
    function saveAddedUsers() {
      sessionStorage.setItem("added_" + me, JSON.stringify(addedUsers));
    }

    function avatarColor(name) {
      let sum = 0;
      for (const ch of name) sum += ch.charCodeAt(0);
      return AVATAR_COLORS[sum % 6];
    }

    function avatarEl(name, size) {
      return (
        `<div class="avatar ${size}" style="background:${avatarColor(name)}">` +
        `${(name[0] || "?").toUpperCase()}</div>`
      );
    }

    // ---------------- Sidebar ----------------
    // Only conversation users + manually added users are ever shown here.
    async function loadConversations() {
      const res = await apiFetch("/conversations");
      conversationUsers = await res.json();
      renderSidebar();
      updateHeaderStatus();
    }

    function sidebarUsers() {
      // Merge: conversation users (authoritative online) + added-only users.
      const map = {};
      conversationUsers.forEach(
        (u) => (map[u.username] = { username: u.username, online: u.online, unread: u.unread_count || 0 })
      );
      Object.keys(addedUsers).forEach((name) => {
        if (!map[name]) map[name] = { username: name, online: !!addedUsers[name].online, unread: 0 };
      });
      return Object.values(map);
    }

    function renderSidebar() {
      renderUserList(sidebarUsers());
    }

    function renderUserList(users) {
      const list = document.getElementById("user-list");
      list.innerHTML = "";
      users.forEach((u) => {
        const item = document.createElement("div");
        item.className = "user-item" + (u.username === activePeer ? " active" : "");
        item.onclick = () => selectPeer(u.username);
        const badge =
          u.unread > 0
            ? `<span class="unread-badge">${u.unread > 9 ? "9+" : u.unread}</span>`
            : u.online
            ? '<span class="online-dot"></span>'
            : "";
        item.innerHTML =
          avatarEl(u.username, "lg") +
          `<div class="u-text">` +
          `<div class="u-name">${u.username}</div>` +
          `<div class="u-sub">Tap to chat</div>` +
          `</div>` +
          badge;
        list.appendChild(item);
      });
    }

    function peerInfo(username) {
      return (
        conversationUsers.find((u) => u.username === username) ||
        (addedUsers[username] ? { username, online: !!addedUsers[username].online } : null)
      );
    }

    function selectPeer(username) {
      activePeer = username;
      // Immediately clear the unread badge for this conversation in the UI.
      const conv = conversationUsers.find((u) => u.username === username);
      if (conv) conv.unread_count = 0;
      renderSidebar();
      const header = document.getElementById("chat-header");
      header.style.display = "flex";
      document.getElementById("composer").style.display = "flex";
      updateHeaderStatus();
      loadMessages();
      // Tell the backend these messages are now read.
      apiFetch("/mark-read/" + encodeURIComponent(username), { method: "POST" }).catch(() => {});
    }

    function updateHeaderStatus() {
      if (!activePeer) return;
      const info = peerInfo(activePeer);
      const online = info && info.online;
      const header = document.getElementById("chat-header");
      header.innerHTML =
        avatarEl(activePeer, "sm") +
        `<div class="ch-text">` +
        `<div class="ch-name">${activePeer}</div>` +
        `<div class="ch-status ${online ? "online" : "offline"}">${
          online ? "Active now" : "Offline"
        }</div>` +
        `</div>`;
    }

    // ---------------- Search (the only place GET /users is used) ----------------
    async function toggleSearch() {
      const panel = document.getElementById("search-panel");
      panel.classList.toggle("open");
      if (panel.classList.contains("open")) {
        // Load the directory of existing usernames to check against.
        try {
          searchDirectory = await (await apiFetch("/users")).json();
        } catch (e) {
          searchDirectory = [];
        }
        document.getElementById("search-input").focus();
      } else {
        document.getElementById("search-input").value = "";
        document.getElementById("search-result").innerHTML = "";
      }
    }

    function onSearch() {
      const q = document.getElementById("search-input").value.trim().toLowerCase();
      const result = document.getElementById("search-result");
      if (!q) {
        result.innerHTML = "";
        return;
      }
      const exact =
        searchDirectory.find((u) => u.username.toLowerCase() === q) ||
        searchDirectory.find((u) => u.username.toLowerCase().includes(q));
      if (exact) {
        result.innerHTML =
          `<span class="check">✓</span><span>${exact.username}</span>` +
          `<button class="add-pill" onclick="addUser('${exact.username}')">Add</button>`;
      } else {
        result.innerHTML = "No user found";
      }
    }

    function addUser(username) {
      const info = searchDirectory.find((u) => u.username === username);
      addedUsers[username] = { online: info ? !!info.online : false };
      saveAddedUsers();
      toggleSearch();
      renderSidebar();
      selectPeer(username);
    }

    // ---------------- Messages ----------------
    async function loadMessages() {
      if (!activePeer) return;
      const res = await apiFetch("/messages/" + encodeURIComponent(activePeer));
      const msgs = await res.json();
      const box = document.getElementById("messages");
      box.innerHTML = "";
      if (msgs.length === 0) {
        box.innerHTML =
          `<div class="empty-chat">` +
          `<div class="empty-ill" aria-hidden="true">` +
          `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ` +
          `stroke-linecap="round" stroke-linejoin="round">` +
          `<path d="M4 4h16v10a4 4 0 0 1-4 4H9l-5 4V4z"></path>` +
          `<path d="M8 9h8"></path>` +
          `<path d="M8 13h5"></path>` +
          `</svg>` +
          `</div>` +
          `<div class="empty-title">No messages yet</div>` +
          `<div class="empty-sub">Send a photo to get the conversation started.</div>` +
          `<button class="btn-primary ghost" onclick="toggleSearch()" ` +
          `aria-label="Open search to find and start a conversation">Find someone</button>` +
          `</div>`;
        return;
      }

      let prev = null;
      msgs.forEach((m, i) => {
        const next = msgs[i + 1] || null;
        // Date separator when the day changes.
        const day = m.timestamp ? new Date(m.timestamp).toDateString() : "";
        const prevDay = prev && prev.timestamp ? new Date(prev.timestamp).toDateString() : null;
        if (day && day !== prevDay) {
          const sep = document.createElement("div");
          sep.className = "date-sep";
          sep.textContent = day;
          box.appendChild(sep);
        }

        const firstInGroup = !prev || prev.sender_username !== m.sender_username || gap(prev, m);
        const lastInGroup = !next || next.sender_username !== m.sender_username || gap(m, next);
        box.appendChild(renderMessage(m, firstInGroup, lastInGroup));
        prev = m;
      });
      box.scrollTop = box.scrollHeight;
    }

    function gap(a, b) {
      if (!a.timestamp || !b.timestamp) return false;
      return Math.abs(new Date(b.timestamp) - new Date(a.timestamp)) > 120000; // 2 min
    }

    function renderMessage(m, firstInGroup, lastInGroup) {
      const row = document.createElement("div");
      row.className = "msg-row " + (m.is_mine ? "sent" : "received") + (lastInGroup ? " last" : "");

      const bubble = document.createElement("div");
      bubble.className = "bubble " + (m.is_mine ? "sent" : "received");

      if (m.is_mine) {
        // Show the just-sent original instantly if we still have it; otherwise
        // decrypt the sender's own copy from the server (persists after re-login).
        if (sentImageCache[m.id]) {
          bubble.innerHTML = `<img src="${sentImageCache[m.id]}" alt="photo" />`;
        } else if (receivedImageCache[m.id]) {
          bubble.innerHTML = `<img src="data:image/jpeg;base64,${receivedImageCache[m.id].b64}" alt="photo" />`;
        } else {
          bubble.innerHTML =
            '<div class="loading-inline"><span class="spinner"></span>Opening...</div>';
          autoOpen(m.id, bubble, true);
        }
        row.appendChild(bubble);
      } else {
        // received: avatar on first of group, spacer otherwise
        if (firstInGroup) {
          const av = document.createElement("div");
          av.innerHTML = avatarEl(m.sender_username, "sm");
          row.appendChild(av.firstChild);
        } else {
          const spacer = document.createElement("div");
          spacer.className = "avatar-spacer";
          row.appendChild(spacer);
        }
        // Auto-open: no button, no clicking. Show cached image, or "Opening..."
        // while it decrypts in the background.
        if (receivedImageCache[m.id]) {
          bubble.innerHTML = renderReceivedImage(receivedImageCache[m.id]);
        } else {
          bubble.innerHTML =
            '<div class="loading-inline"><span class="spinner"></span>Opening...</div>';
          autoOpen(m.id, bubble, false);
        }
        row.appendChild(bubble);
      }
      return row;
    }

    function renderReceivedImage(entry) {
      const delivered = entry.valid ? '<div class="delivered">✓ Delivered</div>' : "";
      return `<img src="data:image/jpeg;base64,${entry.b64}" alt="photo" />` + delivered;
    }

    // Decrypt an image automatically (works for both sent and received copies);
    // cache the result so we never re-fetch or flicker on re-render.
    async function autoOpen(id, bubble, isMine) {
      if (decrypting.has(id)) return;
      decrypting.add(id);
      try {
        const res = await apiFetch("/decrypt-message", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message_id: id }),
        });
        const data = await res.json();
        if (!res.ok) {
          if (bubble.isConnected)
            bubble.innerHTML = '<div class="delivered">Could not open image</div>';
          return;
        }
        receivedImageCache[id] = { b64: data.image_base64, valid: data.signature_valid };
        if (bubble.isConnected) {
          // Sent images show just the photo; received also show "✓ Delivered".
          bubble.innerHTML = isMine
            ? `<img src="data:image/jpeg;base64,${data.image_base64}" alt="photo" />`
            : renderReceivedImage(receivedImageCache[id]);
        }
      } catch (err) {
        if (bubble.isConnected)
          bubble.innerHTML = '<div class="delivered">Could not open image</div>';
      } finally {
        decrypting.delete(id);
      }
    }

    // ---------------- Composer / send ----------------
    let pickedFile = null;

    function onFilePicked() {
      pickedFile = document.getElementById("image-input").files[0] || null;
      renderPreview();
    }

    function setPickedFile(file) {
      if (!file || !file.type.startsWith("image/")) return;
      pickedFile = file;
      renderPreview();
    }

    function clearPicked() {
      pickedFile = null;
      document.getElementById("image-input").value = "";
      renderPreview();
    }

    function renderPreview() {
      const strip = document.getElementById("preview-strip");
      const field = document.getElementById("composer-field");
      const sendBtn = document.getElementById("send-btn");
      if (!pickedFile) {
        strip.classList.remove("open");
        strip.innerHTML = "";
        field.textContent = "Add a photo to send";
        field.classList.remove("active");
        sendBtn.disabled = true;
        return;
      }
      const url = URL.createObjectURL(pickedFile);
      strip.innerHTML =
        `<div class="preview-thumb">` +
        `<img src="${url}" alt="preview" />` +
        `<button class="preview-x" onclick="clearPicked()" title="Remove">×</button>` +
        `</div>` +
        `<div class="preview-meta"><div class="preview-name">${pickedFile.name}</div>` +
        `<div class="preview-hint">Ready to send</div></div>`;
      strip.classList.add("open");
      field.textContent = "Press Send to share";
      field.classList.add("active");
      sendBtn.disabled = false;
    }

    const MAX_BYTES = 80 * 1024;
    const MAX_DIM = 1024;

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(url);
          let { width, height } = img;
          if (width > MAX_DIM || height > MAX_DIM) {
            const scale = MAX_DIM / Math.max(width, height);
            width = Math.round(width * scale);
            height = Math.round(height * scale);
          }
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          canvas.getContext("2d").drawImage(img, 0, 0, width, height);
          const tryQuality = (q) => {
            canvas.toBlob(
              (blob) => {
                if (!blob) return reject(new Error("compress failed"));
                if (blob.size <= MAX_BYTES || q <= 0.3) resolve(blob);
                else tryQuality(q - 0.1);
              },
              "image/jpeg",
              q
            );
          };
          tryQuality(0.8);
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("load failed"));
        };
        img.src = url;
      });
    }

    function readAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error("read failed"));
        reader.readAsDataURL(file);
      });
    }

    // Sending stays non-blocking: the sidebar and other chats remain clickable.
    async function sendImage() {
      if (!activePeer || !pickedFile) return;
      const btn = document.getElementById("send-btn");
      const field = document.getElementById("composer-field");
      const peerForThisSend = activePeer;
      const fileForThisSend = pickedFile;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Sending';

      try {
        // Keep the original image as a data URL so we can show it instantly.
        const originalDataUrl = await readAsDataURL(fileForThisSend);
        const blob = await compressImage(fileForThisSend);
        const form = new FormData();
        form.append("receiver_username", peerForThisSend);
        form.append("image", blob, "image.jpg");
        const res = await apiFetch("/send-image", { method: "POST", body: form });
        const data = await res.json();
        if (!res.ok) {
          alert(data.detail || "Failed to send, try again");
          return;
        }
        // Cache the sent image by its new message id and render immediately.
        if (data.message_id) sentImageCache[data.message_id] = originalDataUrl;
        clearPicked();
        loadConversations(); // peer now has history → appears in sidebar
        if (activePeer === peerForThisSend) loadMessages();
      } catch (err) {
        alert("Failed to send, try again");
      } finally {
        btn.textContent = "Send";
        btn.disabled = !pickedFile;
      }
    }

    // ---------------- WebSocket ----------------
    function connectWs() {
      const proto = window.location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${window.location.host}/ws/${getToken()}`);
      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === "new_message") {
            loadConversations();
            if (data.from === activePeer) loadMessages();
          }
        } catch (e) {}
      };
      ws.onclose = () => setTimeout(connectWs, 3000);
    }

    function doLogout() {
      apiFetch("/logout", { method: "POST" }).finally(logoutLocal);
    }

    window.addEventListener("beforeunload", () => {
      fetch("/logout", {
        method: "POST",
        headers: { Authorization: "Bearer " + getToken() },
        keepalive: true,
      });
    });

    // ---------------- Image viewer ----------------
    // Click any image in the conversation to open it large with a download link.
    function openLightbox(src) {
      const ext = src.startsWith("data:image/png") ? "png" : "jpg";
      document.getElementById("lightbox-img").src = src;
      const dl = document.getElementById("lightbox-download");
      dl.href = src;
      dl.setAttribute("download", "iea-image." + ext);
      document.getElementById("lightbox").classList.add("open");
    }

    function closeLightbox(e) {
      // Ignore clicks on the image itself / download link; close on backdrop or Close.
      if (e && e.target && e.target.closest && e.target.closest(".lightbox-actions")) return;
      if (e && e.target && e.target.id === "lightbox-img") return;
      document.getElementById("lightbox").classList.remove("open");
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") document.getElementById("lightbox").classList.remove("open");
    });

    // Event delegation: any <img> inside a chat bubble opens the viewer.
    document.getElementById("messages").addEventListener("click", (e) => {
      const img = e.target.closest(".bubble img");
      if (img) openLightbox(img.src);
    });

    // Close the profile popup when clicking outside it.
    document.addEventListener("click", (e) => {
      const popup = document.getElementById("profile-popup");
      const strip = document.getElementById("profile-strip");
      if (
        popup.classList.contains("open") &&
        !popup.contains(e.target) &&
        !strip.contains(e.target)
      ) {
        popup.classList.remove("open");
      }
    });

    // ---------------- Drag & drop image upload ----------------
    let dragDepth = 0;
    const dropOverlay = document.getElementById("drop-overlay");

    function showDrop(show) {
      dropOverlay.classList.toggle("open", show);
    }

    window.addEventListener("dragenter", (e) => {
      if (!activePeer || !e.dataTransfer || !e.dataTransfer.types.includes("Files")) return;
      e.preventDefault();
      dragDepth++;
      showDrop(true);
    });
    window.addEventListener("dragleave", (e) => {
      dragDepth = Math.max(0, dragDepth - 1);
      if (dragDepth === 0) showDrop(false);
    });
    window.addEventListener("dragover", (e) => {
      if (e.dataTransfer && e.dataTransfer.types.includes("Files")) e.preventDefault();
    });
    window.addEventListener("drop", (e) => {
      e.preventDefault();
      dragDepth = 0;
      showDrop(false);
      if (!activePeer) return;
      const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (file) setPickedFile(file);
    });

    // ESC clears the picked image preview.
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && pickedFile) clearPicked();
    });

    setupProfile();
    loadConversations();
    connectWs();
    setInterval(loadConversations, 15000);
  </script>
</body>
</html>

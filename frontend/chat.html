<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IEA</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="title">Chats</div>
        <button class="icon-btn" onclick="toggleSearch()" title="Find someone">+</button>
      </div>

      <div class="search-panel" id="search-panel">
        <input class="search-input" id="search-input" placeholder="Search username"
               oninput="onSearch()" />
        <div class="search-result" id="search-result"></div>
      </div>

      <div class="user-list" id="user-list"></div>

      <div class="sidebar-bottom">
        <span id="me-name"></span>
        <button class="text-link" onclick="doLogout()">Log out</button>
      </div>
    </aside>

    <!-- Chat area -->
    <main class="chat">
      <div class="chat-header" id="chat-header" style="display:none"></div>
      <div class="messages" id="messages">
        <div class="empty-chat">Select a chat to start messaging</div>
      </div>
      <div class="composer" id="composer" style="display:none">
        <input type="file" id="image-input" accept="image/*" style="display:none"
               onchange="onFilePicked()" />
        <button class="attach-btn" onclick="document.getElementById('image-input').click()"
                title="Add a photo">+</button>
        <div class="composer-field" id="composer-field">Add a photo to send</div>
        <button class="send-btn" id="send-btn" onclick="sendImage()" disabled>Send</button>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    requireAuth();
    if (isAdmin()) window.location.href = "admin.html";

    const me = getUsername();
    document.getElementById("me-name").textContent = me;

    const AVATAR_COLORS = ["#f4845f", "#a8c5da", "#b8a9c9", "#92c7a3", "#f0c27f", "#7eb8c9"];
    const IMG_ICON =
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>';

    let activePeer = null;
    let usersCache = [];
    let ws = null;

    function avatarColor(name) {
      let sum = 0;
      for (const ch of name) sum += ch.charCodeAt(0);
      return AVATAR_COLORS[sum % 6];
    }

    function avatarEl(name, size) {
      return (
        `<div class="avatar ${size}" style="background:${avatarColor(name)}">` +
        `${(name[0] || "?").toUpperCase()}</div>`
      );
    }

    // ---------------- Sidebar / users ----------------
    async function loadUsers() {
      const res = await apiFetch("/users");
      usersCache = await res.json();
      renderUserList(usersCache);
      updateHeaderStatus();
    }

    function renderUserList(users) {
      const list = document.getElementById("user-list");
      list.innerHTML = "";
      users.forEach((u) => {
        const item = document.createElement("div");
        item.className = "user-item" + (u.username === activePeer ? " active" : "");
        item.onclick = () => selectPeer(u.username);
        item.innerHTML =
          avatarEl(u.username, "lg") +
          `<div class="u-text">` +
          `<div class="u-name">${u.username}</div>` +
          `<div class="u-sub">Tap to chat</div>` +
          `</div>` +
          (u.online ? '<span class="online-dot"></span>' : "");
        list.appendChild(item);
      });
    }

    function peerInfo(username) {
      return usersCache.find((u) => u.username === username);
    }

    function selectPeer(username) {
      activePeer = username;
      renderUserList(usersCache);
      const header = document.getElementById("chat-header");
      header.style.display = "flex";
      document.getElementById("composer").style.display = "flex";
      updateHeaderStatus();
      loadMessages();
    }

    function updateHeaderStatus() {
      if (!activePeer) return;
      const info = peerInfo(activePeer);
      const online = info && info.online;
      const header = document.getElementById("chat-header");
      header.innerHTML =
        avatarEl(activePeer, "sm") +
        `<div class="ch-text">` +
        `<div class="ch-name">${activePeer}</div>` +
        `<div class="ch-status ${online ? "online" : "offline"}">${
          online ? "Active now" : "Offline"
        }</div>` +
        `</div>`;
    }

    // ---------------- Search ----------------
    function toggleSearch() {
      const panel = document.getElementById("search-panel");
      panel.classList.toggle("open");
      if (panel.classList.contains("open")) {
        document.getElementById("search-input").focus();
      } else {
        document.getElementById("search-input").value = "";
        document.getElementById("search-result").innerHTML = "";
        renderUserList(usersCache);
      }
    }

    function onSearch() {
      const q = document.getElementById("search-input").value.trim().toLowerCase();
      const result = document.getElementById("search-result");
      if (!q) {
        result.innerHTML = "";
        renderUserList(usersCache);
        return;
      }
      const matches = usersCache.filter((u) => u.username.toLowerCase().includes(q));
      renderUserList(matches);
      const exact = usersCache.find((u) => u.username.toLowerCase() === q) || matches[0];
      if (exact) {
        result.innerHTML =
          `<span class="check">✓</span><span>${exact.username}</span>` +
          `<button class="add-pill" onclick="openFromSearch('${exact.username}')">Add</button>`;
      } else {
        result.innerHTML = "No user found";
      }
    }

    function openFromSearch(username) {
      toggleSearch();
      selectPeer(username);
    }

    // ---------------- Messages ----------------
    async function loadMessages() {
      if (!activePeer) return;
      const res = await apiFetch("/messages/" + encodeURIComponent(activePeer));
      const msgs = await res.json();
      const box = document.getElementById("messages");
      box.innerHTML = "";
      if (msgs.length === 0) {
        box.innerHTML = '<div class="empty-chat">No messages yet. Send a photo below.</div>';
        return;
      }

      let prev = null;
      msgs.forEach((m, i) => {
        const next = msgs[i + 1] || null;
        // Date separator when the day changes.
        const day = m.timestamp ? new Date(m.timestamp).toDateString() : "";
        const prevDay = prev && prev.timestamp ? new Date(prev.timestamp).toDateString() : null;
        if (day && day !== prevDay) {
          const sep = document.createElement("div");
          sep.className = "date-sep";
          sep.textContent = day;
          box.appendChild(sep);
        }

        const firstInGroup = !prev || prev.sender_username !== m.sender_username || gap(prev, m);
        const lastInGroup = !next || next.sender_username !== m.sender_username || gap(m, next);
        box.appendChild(renderMessage(m, firstInGroup, lastInGroup));
        prev = m;
      });
      box.scrollTop = box.scrollHeight;
    }

    function gap(a, b) {
      if (!a.timestamp || !b.timestamp) return false;
      return Math.abs(new Date(b.timestamp) - new Date(a.timestamp)) > 120000; // 2 min
    }

    function renderMessage(m, firstInGroup, lastInGroup) {
      const row = document.createElement("div");
      row.className = "msg-row " + (m.is_mine ? "sent" : "received") + (lastInGroup ? " last" : "");

      const bubble = document.createElement("div");
      bubble.className = "bubble " + (m.is_mine ? "sent" : "received");

      if (m.is_mine) {
        bubble.innerHTML = `<span class="img-label">${IMG_ICON} Image</span>`;
        row.appendChild(bubble);
      } else {
        // received: avatar on first of group, spacer otherwise
        if (firstInGroup) {
          const av = document.createElement("div");
          av.innerHTML = avatarEl(m.sender_username, "sm");
          row.appendChild(av.firstChild);
        } else {
          const spacer = document.createElement("div");
          spacer.className = "avatar-spacer";
          row.appendChild(spacer);
        }
        bubble.innerHTML =
          `<button class="view-btn" onclick="openImage(${m.id}, this)">View</button>` +
          `<div class="result"></div>`;
        row.appendChild(bubble);
      }
      return row;
    }

    async function openImage(id, btn) {
      const bubble = btn.parentElement;
      btn.style.display = "none";
      const result = bubble.querySelector(".result");
      result.innerHTML = '<div class="loading-inline"><span class="spinner"></span>Opening...</div>';
      try {
        const res = await apiFetch("/decrypt-message", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message_id: id }),
        });
        const data = await res.json();
        if (!res.ok) {
          result.innerHTML = '<div class="delivered">Could not open image</div>';
          return;
        }
        // "✓ Delivered" only when verified; show nothing if not (do not alarm).
        const delivered = data.signature_valid ? '<div class="delivered">✓ Delivered</div>' : "";
        result.innerHTML =
          `<img src="data:image/jpeg;base64,${data.image_base64}" alt="photo" />` + delivered;
      } catch (err) {
        result.innerHTML = '<div class="delivered">Could not open image</div>';
      }
    }

    // ---------------- Composer / send ----------------
    let pickedFile = null;

    function onFilePicked() {
      const input = document.getElementById("image-input");
      pickedFile = input.files[0] || null;
      const field = document.getElementById("composer-field");
      field.textContent = pickedFile ? pickedFile.name : "Add a photo to send";
      document.getElementById("send-btn").disabled = !pickedFile;
    }

    const MAX_BYTES = 80 * 1024;
    const MAX_DIM = 1024;

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(url);
          let { width, height } = img;
          if (width > MAX_DIM || height > MAX_DIM) {
            const scale = MAX_DIM / Math.max(width, height);
            width = Math.round(width * scale);
            height = Math.round(height * scale);
          }
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          canvas.getContext("2d").drawImage(img, 0, 0, width, height);
          const tryQuality = (q) => {
            canvas.toBlob(
              (blob) => {
                if (!blob) return reject(new Error("compress failed"));
                if (blob.size <= MAX_BYTES || q <= 0.3) resolve(blob);
                else tryQuality(q - 0.1);
              },
              "image/jpeg",
              q
            );
          };
          tryQuality(0.8);
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("load failed"));
        };
        img.src = url;
      });
    }

    // Sending stays non-blocking: the sidebar and other chats remain clickable.
    async function sendImage() {
      if (!activePeer || !pickedFile) return;
      const btn = document.getElementById("send-btn");
      const field = document.getElementById("composer-field");
      const peerForThisSend = activePeer;
      const fileForThisSend = pickedFile;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Sending';

      try {
        const blob = await compressImage(fileForThisSend);
        const form = new FormData();
        form.append("receiver_username", peerForThisSend);
        form.append("image", blob, "image.jpg");
        const res = await apiFetch("/send-image", { method: "POST", body: form });
        const data = await res.json();
        if (!res.ok) {
          alert(data.detail || "Failed to send, try again");
          return;
        }
        // reset composer
        pickedFile = null;
        document.getElementById("image-input").value = "";
        field.textContent = "Add a photo to send";
        if (activePeer === peerForThisSend) loadMessages();
      } catch (err) {
        alert("Failed to send, try again");
      } finally {
        btn.textContent = "Send";
        btn.disabled = !pickedFile;
      }
    }

    // ---------------- WebSocket ----------------
    function connectWs() {
      const proto = window.location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${window.location.host}/ws/${getToken()}`);
      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === "new_message") {
            loadUsers();
            if (data.from === activePeer) loadMessages();
          }
        } catch (e) {}
      };
      ws.onclose = () => setTimeout(connectWs, 3000);
    }

    function doLogout() {
      apiFetch("/logout", { method: "POST" }).finally(logoutLocal);
    }

    window.addEventListener("beforeunload", () => {
      fetch("/logout", {
        method: "POST",
        headers: { Authorization: "Bearer " + getToken() },
        keepalive: true,
      });
    });

    loadUsers();
    connectWs();
    setInterval(loadUsers, 15000);
  </script>
</body>
</html>

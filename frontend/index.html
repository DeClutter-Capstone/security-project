<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IEA</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">
  <div class="auth-layout">
    <div class="app-name">IEA</div>
    <div class="subtitle">Private image messaging</div>

    <div class="auth-tabs" id="toggle">
      <button type="button" class="tab-btn active" id="tab-login" onclick="setMode('login')">
        Log in
      </button>
      <button type="button" class="tab-btn" id="tab-register" onclick="setMode('register')">
        Sign up
      </button>
    </div>

    <form id="auth-form" onsubmit="return submitAuth(event)">
      <div class="field-group">
        <input class="field" type="text" id="username" placeholder="Username"
               autocomplete="username" required />
      </div>
      <div class="field-group">
        <input class="field" type="password" id="password" placeholder="Password"
               autocomplete="current-password" required />
      </div>
      <div class="field-group" id="confirm-group" style="display:none">
        <input class="field" type="password" id="confirm-password"
               placeholder="Confirm password" autocomplete="new-password" />
      </div>
      <div class="error-text" id="confirm-error" style="margin-top:0"></div>
      <button type="submit" class="btn-primary" id="submit-btn">Log in</button>
    </form>

    <div class="error-text" id="error"></div>
  </div>

  <script src="app.js"></script>
  <script>
    let mode = "login"; // or "register"

    function setMode(nextMode) {
      mode = nextMode;
      const isLogin = mode === "login";
      document.getElementById("submit-btn").textContent = isLogin ? "Log in" : "Create Account";
      document.getElementById("confirm-group").style.display = isLogin ? "none" : "block";
      document.getElementById("tab-login").classList.toggle("active", isLogin);
      document.getElementById("tab-register").classList.toggle("active", !isLogin);
      document.getElementById("confirm-error").textContent = "";
      setError("");
    }

    function toggleMode() {
      setMode(mode === "login" ? "register" : "login");
    }

    function setError(text) {
      document.getElementById("error").textContent = text;
    }

    async function submitAuth(e) {
      e.preventDefault();
      setError("");
      document.getElementById("confirm-error").textContent = "";
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const btn = document.getElementById("submit-btn");

      // Confirm-password check (frontend validation only).
      if (mode === "register") {
        const confirm = document.getElementById("confirm-password").value;
        if (password !== confirm) {
          document.getElementById("confirm-error").textContent = "Passwords do not match";
          return false;
        }
      }

      btn.disabled = true;

      try {
        if (mode === "register") {
          const res = await fetch("/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });
          const data = await res.json();
          if (!res.ok) {
            setError(data.detail || "Could not create account");
            return false;
          }
          // Auto-login after successful registration.
        }

        const res = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (!res.ok) {
          setError(data.detail || "Incorrect username or password");
          return false;
        }
        sessionStorage.setItem("session_token", data.session_token);
        sessionStorage.setItem("username", data.username);
        sessionStorage.setItem("is_admin", data.is_admin ? "true" : "false");
        window.location.href = data.is_admin ? "admin.html" : "chat.html";
      } catch (err) {
        setError("Something went wrong, try again");
      } finally {
        btn.disabled = false;
      }
      return false;
    }

    if (getToken()) {
      window.location.href = isAdmin() ? "admin.html" : "chat.html";
    }
  </script>
</body>
</html>

services:
  - type: web
    name: iea-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: iea-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: iea-db
    plan: free
